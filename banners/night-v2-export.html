<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>AI Ladies Night — Banner V2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; font-family: "DM Sans", system-ui, sans-serif; }

    .banner {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #0a0a0a;
    }

    .bg-photo {
      position: absolute;
      inset: 0;
      background: url('/public/img/ai-ladies-night-photo.png') center 35% / cover no-repeat;
      opacity: 0.35;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(10,10,10,0.3) 0%,
        rgba(10,10,10,0.5) 40%,
        rgba(10,10,10,0.85) 75%,
        rgba(10,10,10,0.95) 100%
      );
    }

    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 80px 100px;
      z-index: 2;
    }

    .tag {
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #c49f47;
      margin-bottom: 24px;
    }

    h1 {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 260px;
      font-weight: 400;
      line-height: 0.95;
      color: #fff;
      margin-bottom: 16px;
    }

    h1 span {
      background: linear-gradient(115deg, #8a6a24 0%, #c49f47 30%, #e0c87a 50%, #c49f47 70%, #8a6a24 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .info {
      display: flex;
      align-items: center;
      gap: 48px;
      margin-top: 40px;
      padding-top: 36px;
      border-top: 1px solid rgba(196,159,71,0.25);
      flex-wrap: nowrap;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 32px;
      color: rgba(255,255,255,0.7);
    }

    .info-item svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="bg-photo"></div>
    <div class="overlay"></div>
    <div class="content">
      <div class="tag">✦ AI Ladies</div>
      <h1>AI Ladies<br><span>Night</span></h1>
      <div class="info">
        <div class="info-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c49f47" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          27. srpna 2026
        </div>
        <div class="info-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c49f47" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          18:00 – 21:00
        </div>
        <div class="info-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c49f47" stroke-width="1.75"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          Space Café, Praha — Anděl
        </div>
      </div>
    </div>
  </div>
</body>
</html>
