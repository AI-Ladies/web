<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>AI Ladies — YouTube Thumbnail Webinář</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c49f47;
      --gold-dark: #7a5a1e;
      --gold-gradient: linear-gradient(115deg, #7a5a1e 0%, #b8892a 22%, #c49f47 40%, #d4bc6a 55%, #c49f47 68%, #9a7428 84%, #7a5a1e 100%);
      --rose-gold-line: linear-gradient(90deg, #7a5a1e 0%, #c49f47 22%, #d4a85c 40%, #d4927a 56%, #d4627d 76%, #b8445f 100%);
      --dark: #0d0d0d;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #1a1a1a;
      font-family: var(--sans);
    }

    .thumb {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 950px 650px at 18% 45%, rgba(196, 159, 71, 0.2), transparent 65%),
        radial-gradient(ellipse 750px 550px at 84% 68%, rgba(212, 98, 125, 0.14), transparent 60%),
        radial-gradient(ellipse 400px 350px at 55% 12%, rgba(196, 159, 71, 0.05), transparent 55%),
        linear-gradient(155deg, #0d0d0d 0%, #141010 40%, #0d0d0d 100%);
      isolation: isolate;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, black 15%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, black 15%, transparent 75%);
      opacity: 0.35;
    }

    .bottom-line {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      height: 6px;
      background: var(--rose-gold-line);
    }

    .gold-ring {
      position: absolute;
      z-index: 1;
      width: 1200px;
      height: 1200px;
      right: -420px;
      top: -420px;
      border: 1px solid rgba(196, 159, 71, 0.08);
      border-radius: 50%;
    }
    .gold-ring::after {
      content: "";
      position: absolute;
      inset: 90px;
      border: 1px solid rgba(232, 132, 154, 0.06);
      border-radius: inherit;
    }

    .gold-ring-2 {
      position: absolute;
      z-index: 1;
      width: 900px;
      height: 900px;
      left: -320px;
      bottom: -360px;
      border: 1px solid rgba(196, 159, 71, 0.05);
      border-radius: 50%;
    }

    .sparkle {
      position: absolute;
      z-index: 3;
      color: var(--gold);
    }
    .s1 { top: 160px; left: 240px; font-size: 28px; opacity: 0.2; }
    .s2 { top: 120px; right: 300px; font-size: 20px; opacity: 0.15; }
    .s3 { bottom: 200px; right: 260px; font-size: 24px; opacity: 0.18; }
    .s4 { bottom: 240px; left: 300px; font-size: 18px; opacity: 0.12; }
    .s5 { top: 420px; left: 140px; font-size: 14px; opacity: 0.1; }
    .s6 { top: 360px; right: 160px; font-size: 16px; opacity: 0.1; }

    /* Layout */
    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 140px;
      gap: 100px;
    }

    /* Left — text block */
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .logo {
      font-family: var(--serif);
      font-size: 140px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .logo-ai { color: #fff; }
    .logo-ladies {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .divider {
      width: 100px;
      height: 4px;
      background: var(--gold-gradient);
      border-radius: 2px;
      margin: 40px 0 36px;
    }

    .tag {
      display: inline-flex;
      align-self: flex-start;
      align-items: center;
      gap: 12px;
      padding: 16px 42px;
      border-radius: 100px;
      background: rgba(196, 159, 71, 0.1);
      border: 1.5px solid rgba(196, 159, 71, 0.25);
      color: var(--gold);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .claim {
      margin-top: 44px;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.5);
      max-width: 780px;
    }
    .claim .hl {
      color: rgba(255, 255, 255, 0.75);
      font-weight: 600;
    }

    .url {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.28);
    }

    /* Right — play button */
    .right {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .play-outer {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(196, 159, 71, 0.1);
      display: grid;
      place-items: center;
    }

    .play-circle {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(196, 159, 71, 0.08);
      border: 2px solid rgba(196, 159, 71, 0.28);
      display: grid;
      place-items: center;
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 40px 0 40px 68px;
      border-color: transparent transparent transparent var(--gold);
      margin-left: 12px;
      filter: drop-shadow(0 0 20px rgba(196, 159, 71, 0.3));
    }

    .play-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="thumb">
    <div class="grid-overlay"></div>
    <div class="bottom-line"></div>
    <div class="gold-ring"></div>
    <div class="gold-ring-2"></div>

    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">✦</span>
    <span class="sparkle s3">✦</span>
    <span class="sparkle s4">✦</span>
    <span class="sparkle s5">✦</span>
    <span class="sparkle s6">✦</span>

    <div class="content">
      <div class="left">
        <div class="logo">
          <span class="logo-ai">AI</span><span class="logo-ladies">Ladies</span>
        </div>
        <div class="divider"></div>
        <div class="tag">✦ Webinář</div>
        <p class="claim">
          Praktické webináře pro ženy,<br>
          které chtějí <span class="hl">AI používat v&nbsp;praxi.</span>
        </p>
        <div class="url">ailadies.cz</div>
      </div>

      <div class="right">
        <div class="play-outer">
          <div class="play-circle">
            <div class="play-triangle"></div>
          </div>
        </div>
        <span class="play-label">Sleduj webinář</span>
      </div>
    </div>
  </div>
</body>
</html>
